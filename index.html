<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDYDY Max Replacement Service</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>🔊 WDYDY Max Replacement Service</h1>
    <p>Click any button below to replace Max</p>

    <!-- The Soundboard Grid -->
    <div class="soundboard-grid">
        <!-- Requested Top Four Buttons (Swapped Order) -->
        <button class="sound-btn" data-sound="audio/anyway.m4a">Anyway</button>
        <button class="sound-btn" data-sound="audio/incorrect.m4a">Incorrect</button>
        <button class="sound-btn" data-sound="audio/interruption.m4a">Interruption</button>
        <button class="sound-btn" data-sound="audio/tired.m4a">Tired</button>

        <!-- Remaining Buttons (Including Tired 2 mixed in regularly) -->
        <button class="sound-btn" data-sound="audio/bbc.m4a">BBC</button>
        <button class="sound-btn" data-sound="audio/dinner.m4a">Dinner</button>
        <button class="sound-btn" data-sound="audio/flatwhite.m4a">Flat White</button>
        <button class="sound-btn" data-sound="audio/in%20it%20for%20life.m4a">In It For Life</button>
        <button class="sound-btn" data-sound="audio/Jamie.m4a">Jamie</button>
        <button class="sound-btn" data-sound="audio/lulu.m4a">Lulu</button>
        <button class="sound-btn" data-sound="audio/meadan.m4a">Meadan</button>
        <button class="sound-btn" data-sound="audio/microwave.m4a">Microwave</button>
        <button class="sound-btn" data-sound="audio/showbiz.m4a">Showbiz</button>
        <button class="sound-btn" data-sound="audio/sooceram.m4a">Sooceram</button>
        <button class="sound-btn" data-sound="audio/teddington.m4a">Teddington</button>
        <button class="sound-btn" data-sound="audio/tired2.m4a">Tired 2</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
